name: Daily fun facts

on:
  schedule:
    # 11:00 IST
    - cron: "30 5 * * *"
    # 14:30 IST
    - cron: "0 9 * * *"
    # 16:30 IST
    - cron: "0 11 * * *"
    # 19:30 IST
    - cron: "0 14 * * *"
    # 21:30 IST
    - cron: "0 16 * * *"
    # 23:30 IST
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-fact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send fun fact
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py
